[project]
name = "ai-insurance-agent"
version = "0.1.0"
description = "The AI Insurance Agent that automates the process of collecting information on the collection of Insurance and Debt"
authors = [
    {name = "y"}
]
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">=3.10.0,<4.0.0"
dependencies = [
    "fastapi (>=0.128.0,<0.129.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "sqlmodel (>=0.0.31,<0.0.32)",
    "sqlalchemy (>=2.0.45,<3.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "pytz (>=2025.2,<2026.0)",
    "redis (>=7.1.0,<8.0.0)",
    "langchain (>=1.2.0,<2.0.0)",
    "langchain-openai (>=1.1.6,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "celery (>=5.6.2,<6.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "alembic (>=1.17.2,<2.0.0)",
    "celery (>=5.6.2,<6.0.0)"
]
